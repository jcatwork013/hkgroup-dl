# ── CỜ TẠM ĐÓNG duoclieuhk — phần http context ──────────────────────────────
# Cài vào: /etc/nginx/conf.d/duoclieuhk-closed.conf   (nạp TRƯỚC sites-enabled)
#
# CỜ = sự tồn tại của file /etc/nginx/flags/duoclieuhk.closed
#   ĐÓNG:  touch /etc/nginx/flags/duoclieuhk.closed   → hiệu lực NGAY, KHÔNG cần reload
#   MỞ:    rm -f /etc/nginx/flags/duoclieuhk.closed   → hiệu lực NGAY
#   (dùng deploy/hk-site.sh close|open|status cho tiện)
#
# XEM TRƯỚC khi đang đóng (nội bộ): mở URL có ?mo_cua=<KEY> — nginx set cookie hk_open
# 12 giờ, sau đó duyệt web/admin bình thường. Đổi KEY: sửa file này rồi
# `nginx -t && systemctl reload nginx`. KEY thật KHÔNG commit vào repo.

map $cookie_hk_open $hk_bypass_cookie { default 0; "__BYPASS_KEY__" 1; }
map $arg_mo_cua     $hk_bypass_arg    { default 0; "__BYPASS_KEY__" 1; }

# bypass = 1 nếu cookie HOẶC query param khớp KEY ("00" = cả hai đều không khớp)
map "$hk_bypass_cookie$hk_bypass_arg" $hk_bypass { default 1; "00" 0; }

# Ghi cookie xem trước khi vào bằng ?mo_cua=<KEY> (rỗng = không set header)
map $hk_bypass_arg $hk_set_cookie {
    default "";
    1 "hk_open=__BYPASS_KEY__; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax";
}
