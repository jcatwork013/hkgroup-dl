# ── CỜ TẠM ĐÓNG duoclieuhk — dùng cho vhost TRẢ HTML (web/invest/admin) ─────
# Cài vào: /etc/nginx/snippets/duoclieuhk-closed.conf
# Include ở TRONG khối `server { ... }` (443) của từng vhost duoclieuhk.
# Xem map $hk_bypass / $hk_set_cookie ở /etc/nginx/conf.d/duoclieuhk-closed.conf.

set $hk_closed 0;
if (-f /etc/nginx/flags/duoclieuhk.closed) { set $hk_closed 1; }
if ($hk_bypass)  { set $hk_closed 0; }   # nội bộ có KEY → vẫn vào được
# QUAN TRỌNG: internal redirect sang trang lỗi cũng đi qua rewrite phase này —
# không loại trừ sẽ thành vòng lặp và nginx rơi về trang 503 mặc định.
if ($uri ~ "^/__hk_closed\.") { set $hk_closed 0; }
if ($hk_closed)  { return 503; }

add_header Set-Cookie $hk_set_cookie always;

# 503 (KHÔNG phải 404/200) + Retry-After → Google hiểu là TẠM thời, giữ nguyên index.
error_page 503 /__hk_closed.html;
location = /__hk_closed.html {
    internal;
    root /var/www/duoclieuhk-closed;
    add_header Retry-After   "86400" always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}
