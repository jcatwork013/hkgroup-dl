# ── CỜ TẠM ĐÓNG duoclieuhk — dùng cho vhost API (api / api-web) ─────────────
# Cài vào: /etc/nginx/snippets/duoclieuhk-closed-api.conf
# Giống bản HTML nhưng trả JSON để client (app/web) parse được lỗi.

set $hk_closed 0;
if (-f /etc/nginx/flags/duoclieuhk.closed) { set $hk_closed 1; }
if ($hk_bypass)  { set $hk_closed 0; }
# QUAN TRỌNG: internal redirect sang trang lỗi cũng đi qua rewrite phase này —
# không loại trừ sẽ thành vòng lặp và nginx rơi về trang 503 mặc định.
if ($uri ~ "^/__hk_closed\.") { set $hk_closed 0; }
if ($hk_closed)  { return 503; }

error_page 503 /__hk_closed.json;
location = /__hk_closed.json {
    internal;
    root /var/www/duoclieuhk-closed;
    default_type application/json;
    add_header Retry-After   "86400" always;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Robots-Tag  "noindex, nofollow" always;
}
