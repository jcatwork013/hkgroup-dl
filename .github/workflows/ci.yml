name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hk
          POSTGRES_PASSWORD: hk
          POSTGRES_DB: hkgroup
        ports: ["5441:5432"]
        options: >-
          --health-cmd "pg_isready -U hk -d hkgroup"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://hk:hk@localhost:5441/hkgroup?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Chặn float trên đường đi của tiền (BẤT BIẾN #1)
        run: make grep-float

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: Chạy migration
        working-directory: backend
        run: go run ./cmd/migrate up

      - name: Unit + integration tests
        working-directory: backend
        run: go test -tags=integration ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8090
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
