# ── HK SHOP (duoclieuhk.vn) — CHỈ FRONTEND ───────────────────────────────────
# duoclieuhk.vn chỉ là web bán hàng (Next.js). KHÔNG có backend riêng: mọi dữ liệu
# (sản phẩm, settings, đăng nhập, ảnh) lấy từ MỘT API duy nhất https://api.duoclieuhk.vn
# (backend + admin nằm ở hệ thống invest — project `hkgroup`, /root/hkgroup).
#   Admin cấu hình tất cả ở admin.duoclieuhk.vn/admin.
# Publish web(13120) cho host-nginx proxy duoclieuhk.vn → tới đây.
# Chạy:  docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
name: hkshop

services:
  web:
    image: hkshop-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: https://duoclieuhk.vn
        # MỘT API duy nhất cho web.
        NEXT_PUBLIC_INVEST_API_URL: https://api.duoclieuhk.vn
    container_name: hkshop-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side (RSC/sitemap) fetch catalog/settings THẲNG tới container api của project
      # hkgroup qua mạng docker nội bộ (~5ms) thay vì vòng ra Cloudflare rồi quay lại (0.1–1s
      # mỗi lần → trang sản phẩm no-store bị chậm). Cần join mạng `hkgroup_default` bên dưới.
      INVEST_INTERNAL_API_URL: http://hkgroup-api-1:8080
      NEXT_PUBLIC_INVEST_API_URL: https://api.duoclieuhk.vn
    ports:
      - "127.0.0.1:13120:3000" # host-nginx: duoclieuhk.vn → 127.0.0.1:13120
    networks: [hkshop-net, hkgroup]

networks:
  hkshop-net:
    name: hkshop-net
    driver: bridge
  # Mạng của project hkgroup (/root/hkgroup) — chỉ để gọi api nội bộ. Nếu hkgroup bị
  # `compose down` (mạng bị tạo lại) thì phải recreate hkshop-web để nối lại.
  hkgroup:
    name: hkgroup_default
    external: true
